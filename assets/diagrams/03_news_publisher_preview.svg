<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="waBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <linearGradient id="glowArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#25D366" />
    </linearGradient>

    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#25D366" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="380" rx="14" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
    NEWSPUBLISHER: AUTOMATED CMS-TO-WHATSAPP FORMATTING ENGINE
  </text>
  <text x="40" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">
    Zero-config text sanitizer, word-boundary truncation, UTM link decorator, and media composer
  </text>

  <!-- Column 1: Raw CMS Input -->
  <g transform="translate(40, 95)" filter="url(#shadow3)">
    <rect width="265" height="255" rx="12" fill="url(#cardGradDark)" stroke="#38BDF8" stroke-width="1.5" />
    <rect width="265" height="32" rx="12" fill="#0284C7" fill-opacity="0.15" />
    <text x="16" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8">1. Raw CMS / Article Payload</text>

    <g transform="translate(16, 46)">
      <rect width="233" height="190" rx="8" fill="#090D16" stroke="#334155" stroke-width="1" />
      
      <text x="12" y="24" font-family="monospace" font-size="11" fill="#94A3B8">title:</text>
      <text x="56" y="24" font-family="monospace" font-size="11" fill="#F8FAFC">"SpaceX Falcon 9"</text>
      
      <text x="12" y="46" font-family="monospace" font-size="11" fill="#94A3B8">html:</text>
      <text x="56" y="46" font-family="monospace" font-size="10.5" fill="#FBBF24">&lt;p&gt;Historic launch...</text>
      <text x="12" y="64" font-family="monospace" font-size="10.5" fill="#FBBF24">success with 23 sats&lt;/p&gt;</text>

      <text x="12" y="90" font-family="monospace" font-size="11" fill="#94A3B8">url:</text>
      <text x="46" y="90" font-family="monospace" font-size="10.5" fill="#38BDF8">https://mezha.media/p/1</text>

      <text x="12" y="116" font-family="monospace" font-size="11" fill="#94A3B8">utm:</text>
      <text x="46" y="116" font-family="monospace" font-size="10.5" fill="#A78BFA">{ source: "whatsapp" }</text>

      <text x="12" y="142" font-family="monospace" font-size="11" fill="#94A3B8">media:</text>
      <text x="56" y="142" font-family="monospace" font-size="10.5" fill="#34D399">"https://.../cover.jpg"</text>

      <rect x="12" y="160" width="209" height="20" rx="4" fill="#1E293B" />
      <text x="116" y="174" font-family="sans-serif" font-size="9.5" fill="#94A3B8" text-anchor="middle">Input length: ~1,500 chars</text>
    </g>
  </g>

  <!-- Flow 1 -> 2 -->
  <line x1="315" y1="222" x2="345" y2="222" stroke="url(#glowArrow)" stroke-width="2.5" marker-end="url(#arrow3)" />

  <!-- Column 2: NewsPublisher Engine -->
  <g transform="translate(355, 95)" filter="url(#shadow3)">
    <rect width="250" height="255" rx="12" fill="url(#cardGradDark)" stroke="#818CF8" stroke-width="1.5" />
    <rect width="250" height="32" rx="12" fill="#6366F1" fill-opacity="0.15" />
    <text x="16" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#818CF8">2. SDK Engine Processing</text>

    <!-- Pipeline steps -->
    <g transform="translate(14, 46)">
      <!-- Step A -->
      <rect width="222" height="38" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="19" r="8" fill="#818CF8" fill-opacity="0.2" />
      <text x="16" y="23" font-family="sans-serif" font-size="10" font-weight="700" fill="#818CF8" text-anchor="middle">A</text>
      <text x="32" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">HTML Strip &amp; Normalize</text>
      <text x="32" y="30" font-family="sans-serif" font-size="9" fill="#94A3B8">Removes tags, decodes entities</text>

      <!-- Step B -->
      <rect y="46" width="222" height="38" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="65" r="8" fill="#10B981" fill-opacity="0.2" />
      <text x="16" y="69" font-family="sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">B</text>
      <text x="32" y="64" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Word-Boundary Cut</text>
      <text x="32" y="76" font-family="sans-serif" font-size="9" fill="#94A3B8">No cut words, appends "..."</text>

      <!-- Step C -->
      <rect y="92" width="222" height="38" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="111" r="8" fill="#F59E0B" fill-opacity="0.2" />
      <text x="16" y="115" font-family="sans-serif" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle">C</text>
      <text x="32" y="110" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">UTM Query Builder</text>
      <text x="32" y="122" font-family="sans-serif" font-size="9" fill="#94A3B8">utm_source, medium, campaign</text>

      <!-- Step D -->
      <rect y="138" width="222" height="42" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="159" r="8" fill="#EC4899" fill-opacity="0.2" />
      <text x="16" y="163" font-family="sans-serif" font-size="10" font-weight="700" fill="#EC4899" text-anchor="middle">D</text>
      <text x="32" y="156" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Channel Payload Builder</text>
      <text x="32" y="170" font-family="sans-serif" font-size="9" fill="#94A3B8">Validates caption ≤ 1024 chars</text>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <line x1="615" y1="222" x2="645" y2="222" stroke="url(#glowArrow)" stroke-width="2.5" marker-end="url(#arrow3)" />

  <!-- Column 3: WhatsApp Post Result -->
  <g transform="translate(655, 95)" filter="url(#shadow3)">
    <rect width="265" height="255" rx="12" fill="url(#waBubbleGrad)" stroke="#25D366" stroke-width="1.5" />
    <rect width="265" height="32" rx="12" fill="#25D366" fill-opacity="0.2" />
    <text x="16" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#25D366">3. WhatsApp Channel Broadcast</text>

    <!-- Post Mockup -->
    <g transform="translate(14, 44)">
      <!-- Media Header Thumbnail -->
      <rect width="237" height="74" rx="8" fill="#065F46" />
      <path d="M 20 60 L 60 25 L 95 50 L 135 15 L 180 60 Z" fill="#047857" opacity="0.6" />
      <circle cx="180" cy="30" r="10" fill="#34D399" opacity="0.7" />
      <text x="118" y="42" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">📸 Image Attached</text>

      <!-- Post Text -->
      <text x="4" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
        *SpaceX Falcon 9 Launch* 🚀
      </text>

      <text x="4" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#E2E8F0">
        Historic launch completed successfully...
      </text>

      <text x="4" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#38BDF8">
        🔗 Read more: https://mezha.media/p/1?utm_source=whatsapp
      </text>

      <!-- Footer timestamp & delivered checkmarks -->
      <line x1="0" y1="162" x2="237" y2="162" stroke="#065F46" stroke-width="1" />
      <text x="4" y="180" font-family="sans-serif" font-size="9.5" fill="#A7F3D0">12:45 PM · Broadcast to 18.5k</text>
      <text x="233" y="180" font-family="sans-serif" font-size="10" font-weight="700" fill="#25D366" text-anchor="end">✓✓ Sent</text>
    </g>
  </g>
</svg>
